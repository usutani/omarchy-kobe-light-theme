regular5=BC05BC
regular6=0598BC
regular7=3B3B3B

bright0=666666
bright1=CD3131
bright2=14CE14
bright3=B5BA00
bright4=0451A5
bright5=BC05BC
bright6=0598BC
bright7=A5A5A5